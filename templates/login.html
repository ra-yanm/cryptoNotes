{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="auth-page">
    <h1>Welcome!</h1>
    <p>Please login with your ID and password.</p>
    <form class="login-form" method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h4>User ID / Email</h4>
        <input type="text" name="userID" placeholder=" Enter User ID / Email" required>
        <h4>Password</h4>
        <input type="password" name="password" placeholder="Enter Password" required>
        <input type="submit" value="Login">
    </form>
    <p><a href="{{ url_for('register') }}">Create an account</a></p>
</section>

{% endblock %}
